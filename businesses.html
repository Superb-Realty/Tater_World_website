<style>
.biz-hero-bg {
  background: linear-gradient(160deg, #0a0500 0%, #1a0a00 40%, #3d1a00 75%, #5a3000 100%);
}
.biz-hero-pattern {
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(201,168,76,0.08) 1px, transparent 1px);
  background-size: 40px 40px;
}

.overview-banner {
  background: var(--navy);
  padding: 3rem 4.5rem;
  border-bottom: 1px solid rgba(201,168,76,0.1);
}
.overview-inner {
  display: flex; align-items: center; gap: 5rem;
  max-width: 1200px;
}
.overview-stat { flex-shrink: 0; text-align: center; }
.overview-stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.5rem; font-weight: 300; color: var(--gold); line-height: 1;
}
.overview-stat-label {
  font-size: 0.6rem; font-weight: 500; letter-spacing: 0.2em;
  text-transform: uppercase; color: rgba(255,255,255,0.35);
  margin-top: 0.3rem;
}
.overview-divider { width: 1px; height: 60px; background: rgba(201,168,76,0.15); flex-shrink: 0; }
.overview-text {
  flex: 1;
  min-width: 180px;
  font-size: 0.95rem; font-weight: 300; line-height: 1.85;
  color: rgba(255,255,255,0.6);
}

/* ──────────────────────────────────────────────────────────────
   PREMIUM COMPACT CARD GRID LAYOUT
   ────────────────────────────────────────────────────────────── */

.companies-grid-container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem;
  width: 100%;
  max-width: 100%;
  padding: 0 20px;
  margin: 0 auto;
  box-sizing: border-box;
}

/* Handle odd number of cards — center the last card */
.companies-grid-container.has-odd-count > :last-child {
  grid-column: 1 / -1;
  width: 100%;
  max-width: 650px;
  margin-left: auto;
  margin-right: auto;
}

.premium-biz-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 1.5rem 2.5rem 2.5rem 2.5rem;
  border: 2px solid rgba(201,168,76,0.25);
  border-radius: 2px;
  background: linear-gradient(135deg, #f8f6f2 0%, #faf9f7 50%, #f6f4f0 100%);
  transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
  position: relative;
  overflow: hidden;
  min-height: 520px;
  justify-content: flex-start;
}

.premium-biz-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(180deg, rgba(201,168,76,0.02) 0%, transparent 40%, rgba(201,168,76,0.01) 100%);
  pointer-events: none;
}

.premium-biz-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
  pointer-events: none;
}

.premium-biz-card:hover {
  border-color: rgba(201,168,76,0.45);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
  transform: translateY(-8px);
  background: linear-gradient(135deg, #faf9f7 0%, #fcfbf9 50%, #f9f7f4 100%);
}

/* Subtle variation for even cards */
.premium-biz-card:nth-child(2n) {
  background: linear-gradient(135deg, #faf8f5 0%, #fcfbf9 50%, #f8f5f1 100%);
  border-color: rgba(201,168,76,0.22);
}

.premium-biz-card:nth-child(2n):hover {
  border-color: rgba(201,168,76,0.45);
  background: linear-gradient(135deg, #fcfbf9 0%, #fefdfb 50%, #faf8f5 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
}

/* Logo — prominent and generous */
.card-logo {
  width: 100%;
  max-width: 192px;
  height: 192px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

.card-logo img {
  max-height: 240px;
  max-width: 240px;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
}
/* Increase size for Superb Realty logo only (cleaner spacing) */
#superb-realty .card-logo {
  max-width: 240px;
  /* height: 400px; */
  margin-top: 14px;
  margin-bottom: 6px;
}

#superb-realty .card-logo img {
  max-height: 400px;
  max-width: 400px;
}
/* Brand name — hidden */
.card-name {
  display: none;
}

/* Description — refined and elegant */
.card-desc {
  font-size: 0.9rem;
  font-weight: 300;
  line-height: 1.75;
  color: #5a5a5a;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
  min-height: auto;
  display: block;
  flex-grow: 1;
  letter-spacing: 0.2px;
  width: 50%;
  margin-left: auto;
  margin-right: auto;
}

/* Keyword tags — elegant and refined */
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  justify-content: center;
  position: relative;
  z-index: 1;
  width: 100%;
  margin-top: auto;
  margin-bottom: 0;
  padding-bottom: 0;
}

.card-tag {
  font-size: 0.93rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: none;
  color: #7d5d10;
  border: 1px solid rgba(139,105,20,0.28);
  border-radius: 999px;
  padding: 0.5rem 1rem;
  transition: all 0.35s ease;
  white-space: nowrap;
  background: rgba(201,168,76,0.05);
}

.premium-biz-card:hover .card-tag {
  border-color: rgba(201,168,76,0.55);
  background: rgba(201,168,76,0.12);
  color: #9b7217;
}

.sector-title-bar {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 2.5rem;
  padding: 0 20px 1.5rem 20px;
  border-bottom: 1px solid var(--cream-dark);
}

.stb-icon {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  border: 1px solid rgba(201,168,76,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
}

.stb-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.2rem;
  font-weight: 400;

}

/* ──────────────────────────────────────────────────────────────
   SECTION BACKGROUNDS & STYLING
   ────────────────────────────────────────────────────────────── */

.section-wrap {
  padding: 4rem 0;
  background: var(--white);
}

/* ──────────────────────────────────────────────────────────────
   RESPONSIVE ADJUSTMENTS
   ────────────────────────────────────────────────────────────── */

@media (max-width: 768px) {
  .companies-grid-container {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  .companies-grid-container.has-odd-count > :last-child {
    grid-column: 1;
    max-width: 100%;
  }

  .premium-biz-card {
    padding: 1.5rem 2rem 2rem 2rem;
    min-height: 480px;
  }

  .card-logo {
    max-width: 144px;
    height: 144px;
    margin-bottom: 10px;
  }

  .card-logo img {
    max-height: 132px;
    max-width: 132px;
  }

  .card-desc {
    font-size: 0.87rem;
    margin-bottom: 1.5rem;
  }

  .card-tag {
    font-size: 0.89rem;
    padding: 0.38rem 0.78rem;
  }
}

@media (max-width: 480px) {
  .companies-grid-container {
    gap: 1rem;
  }

  .premium-biz-card {
    padding: 1.25rem;
  }

  .card-logo {
    max-width: 100px;
    height: 100px;
    margin-bottom: 8px;
  }

  .card-name {
    font-size: 1.1rem;
  }

  .card-tag {
    font-size: 0.85rem;
    padding: 0.32rem 0.66rem;
  }
}
</style>

<body>

    <p class="page-hero-lead">From the artistry of fine jewellery to the architecture of modern urban living and the promise of early education every brand shares a single commitment to lasting quality.</p>
  </div>
</section>

<!-- All sector + company cards — rendered from TATER.sectors + TATER.companies -->
<div id="companies-root"></div>

</main>
<div id="footer-root"></div>
<script src="data/init.js"></script>
<script src="data/site.js"></script>
<script src="data/companies.js"></script>
<script src="data/leadership.js"></script>
<script src="data/founder.js"></script>
<script src="data/csr.js"></script>
<script src="data/news.js"></script>
<script src="nav.js"></script>
<script>
/* ── PREMIUM COMPACT BUSINESSES PAGE RENDERER ──────────────────
   All content driven by split TATER data files.
   To add a company: edit TATER.companies in data/companies.js only.
   ─────────────────────────────────────────────────────────────── */

function renderChips(chips, dark) {
  return chips.map(chip => {
    return `<span class="card-tag">${chip}</span>`;
  }).join('');
}

function renderCompanyCard(company) {
  const fullDesc = Array.isArray(company.description)
    ? company.description.map(p => p).join(' ')
    : company.description;

  const cardClasses = [
    'premium-biz-card',
    company.dark ? 'dark' : '',
    'reveal',
    !company.logo ? 'no-logo' : ''
  ].filter(Boolean).join(' ');

  const logoHtml = company.logo
    ? `<div class="card-logo">
         <img src="${company.logo}" alt="${company.name} logo" loading="lazy" decoding="async"/>
       </div>`
    : '';

  const cardContent = `
    <div id="${company.id}" class="${cardClasses}">
      ${logoHtml}
      <p class="card-desc">${fullDesc}</p>
      <div class="card-tags">${renderChips(company.chips, company.dark)}</div>
    </div>
  `;

  if (company.website) {
    return `<a href="${company.website}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit; display: block;">${cardContent}</a>`;
  }

  return cardContent;
}

function renderSector(sector) {
  const companies = TATER.companies.filter(c => c.sector === sector.id);
  if (!companies.length) return '';

  const isLight = sector.id !== 'jewellery';
  const iconStyle = isLight ? `border-color:rgba(201,168,76,0.3)` : '';

  const gridHtml = companies.map(renderCompanyCard).join('');
  
  // Check if odd number of cards to apply centering logic
  const hasOddCount = companies.length % 2 === 1 ? 'has-odd-count' : '';

  return `
    <section class="section-wrap ${isLight ? 'light' : 'white'}" id="${sector.id}">
      <div class="sector-title-bar reveal">
        <div class="stb-icon" style="${iconStyle}" >${sector.icon}</div>
        <div>
          <div class="section-label" style="margin-bottom:0.25rem">Sector ${sector.number}</div>
          <div class="stb-title" style="color:var(--text-dark)">${sector.label}</div>
        </div>
      </div>
      <div class="companies-grid-container ${hasOddCount}">
        ${gridHtml}
      </div>
    </section>
  `;
}

// Run renderers
document.getElementById('companies-root').innerHTML = TATER.sectors.map(renderSector).join('');
</script>
</body>
