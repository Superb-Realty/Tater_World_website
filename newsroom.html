<title>TATER World</title>
<link rel="stylesheet" href="styles.css"/>
<style>

.news-hero-bg {
  background: linear-gradient(160deg, #050812 0%, #0a1020 45%, #0f1830 80%, #162035 100%);
}

/* ── FILTER BAR ───────────────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 2.5rem;
  flex-wrap: wrap;
  margin-bottom: 5rem;
  align-items: center;
  border-bottom: 1px solid rgba(201,168,76,0.12);
  padding-bottom: 0;
}

.filter-btn {
  padding: 0 0 1.25rem 0;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
  border: none;
  border-bottom: 1.5px solid transparent;
  color: rgba(255,255,255,0.3);
  transition: all 0.3s ease;
  position: relative;
  top: 1px;
}

.filter-btn:hover {
  color: rgba(255,255,255,0.65);
}

.filter-btn.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* ── GRID ─────────────────────────────────────────────────── */
.news-grid-3 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
  padding-top: 2rem;
  padding-bottom: 1rem;
}

/* Tablet: 2 columns */
@media (min-width: 640px) {
  .news-grid-3 {
    grid-template-columns: repeat(2, 1fr);
    gap: 1.25rem;
  }
}

/* Desktop: 3 columns */
@media (min-width: 1024px) {
  .news-grid-3 {
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }
}

/* Media grid always 2 columns on tablet+, 1 on mobile */
.news-grid-3.media-grid {
  grid-template-columns: 1fr;
  gap: 1rem;
}

@media (min-width: 640px) {
  .news-grid-3.media-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 1.25rem;
  }
}

@media (min-width: 1024px) {
  .news-grid-3.media-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
  }
}

/* ── CARD ─────────────────────────────────────────────────── */
.news-card {
  background: #0b1422;
  padding: 3rem;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 1.4rem;
  transition: background 0.4s ease;
}

.news-card > div:first-child img {
  display: block;
}

.news-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--gold) 0%, rgba(201,168,76,0.3) 60%, transparent 100%);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}

.news-card:hover {
  background: #0f1a2e;
}

.news-card:hover::after {
  transform: scaleX(1);
}

/* ── CATEGORY LABEL ───────────────────────────────────────── */
.news-tag {
  font-size: 0.52rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(201,168,76,0.55);
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.news-tag::before {
  content: '';
  width: 20px;
  height: 1px;
  background: rgba(201,168,76,0.4);
  flex-shrink: 0;
}

/* ── TITLE ────────────────────────────────────────────────── */
.news-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.55rem;
  font-weight: 400;
  color: rgba(255,255,255,0.85);
  line-height: 1.4;
  letter-spacing: 0.01em;
  transition: color 0.3s;
}

.news-card:hover .news-title {
  color: #fff;
}

/* ── BODY ─────────────────────────────────────────────────── */
.news-body {
  font-size: 0.82rem;
  font-weight: 300;
  line-height: 1.85;
  color: rgba(255,255,255,0.35);
  flex-grow: 1;
  transition: color 0.3s;
}

.news-card:hover .news-body {
  color: rgba(255,255,255,0.52);
}

/* ── COMING SOON ──────────────────────────────────────────── */
.coming-soon-banner {
  margin-top: 7rem;
  padding: 5rem 4rem;
  text-align: center;
  border-top: 1px solid rgba(201,168,76,0.1);
}

.csb-rule {
  width: 36px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
  margin: 0 auto 2.5rem auto;
}

.csb-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.1rem;
  font-style: italic;
  font-weight: 300;
  color: rgba(255,255,255,0.2);
  margin-bottom: 1rem;
  letter-spacing: 0.02em;
}

.csb-desc {
  font-size: 0.78rem;
  font-weight: 300;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.06em;
  max-width: 420px;
  margin: 0 auto;
  line-height: 1.9;
}

.news-card a {
  transition: all 0.3s ease;
}

.news-card a:hover {
  border-color: var(--gold);
  background: rgba(201,168,76,0.12);
  box-shadow: 0 0 20px rgba(201,168,76,0.15);
}

.news-card.highlight {
  box-shadow: 0 0 0 2px var(--gold), 0 0 30px rgba(201,168,76,0.4);
  animation: pulse-highlight 0.6s ease-out;
}

@keyframes pulse-highlight {
  0% {
    box-shadow: 0 0 0 0px rgba(201,168,76,0.8), 0 0 30px rgba(201,168,76,0.4);
  }
  100% {
    box-shadow: 0 0 0 8px rgba(201,168,76,0), 0 0 30px rgba(201,168,76,0);
  }
}

/* ── EVENT CARD CAROUSEL & EXPANSION ─────────────────────── */
.news-card.event-card {
  padding: 0;
  overflow: visible;
  gap: 0;
  flex-direction: column;
  display: flex;
  height: 100%;
}

.news-card.event-card.expanded {
  height: auto;
}

.news-card.event-card .news-title {
  margin-left: 3rem;
  margin-right: 3rem;
  margin-top: 1.2rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: calc(1.4em * 2);
}

.event-card-meta-row {
  margin-left: 3rem;
  margin-right: 3rem;
  margin-top: 1.4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.event-card-meta-row .news-tag {
  margin: 0;
}

.event-card-date {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}

.event-card-image-wrapper {
  width: 100%;
  height: 400px;
  overflow: hidden;
  position: relative;
}

.event-card-carousel {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.event-card-image {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0f1a2e, #162035);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}

.event-card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: opacity 0.3s ease;
}

.event-card-image.placeholder {
  background: linear-gradient(135deg, #0f1a2e, #162035);
  font-size: 3rem;
  color: rgba(201,168,76,0.2);
}

/* Carousel controls for events */
.event-card-carousel .carousel-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.4);
  color: white;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  transition: all 0.3s ease;
  z-index: 10;
}

.event-card-carousel .carousel-nav:hover {
  background: rgba(0,0,0,0.7);
}

.event-card-carousel .carousel-nav.prev {
  left: 12px;
}

.event-card-carousel .carousel-nav.next {
  right: 12px;
}

.event-card-carousel .carousel-dots {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 10;
}

.event-card-carousel .carousel-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
}

.event-card-carousel .carousel-dot.active {
  background: rgba(255,255,255,0.9);
  width: 24px;
  border-radius: 4px;
}

/* Event card content section */
.event-card-image-wrapper + .news-tag,
.event-card-image-wrapper ~ .event-card-body,
.event-card-image-wrapper ~ .event-card-footer {
  margin-left: 3rem;
  margin-right: 3rem;
}

.event-card-image-wrapper + .news-tag {
  margin-top: 1.4rem;
}

.event-card-body {
  line-height: 1rem;
  transition: max-height 0.4s ease;
  display: flex;
  flex-direction: column;
  gap: 0.0rem;
  min-height: 0;
}

.event-card-body.truncated {
  max-height: fit-content;
}

.event-card-body .news-body {
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-wrap: break-word;
  word-break: break-word;
  white-space: normal;
}

.event-card-summary {
  margin: 0;
}

.event-card-body.expanded .news-body {
  display: block;
  overflow: visible;
  -webkit-line-clamp: unset;
}

.event-card-footer {
  margin-top: auto;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(201,168,76,0.15);
}

/* ── MEDIA CARD (FIXED CONTAINER, CONTENT ADAPTS) ───────── */
.media-card {
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  gap: 0;
  transition: all 0.4s ease;
  padding: 0;
  margin: 0;
  width: 100%;
  height: auto;
}

.media-card:hover {
  border-color: #8B6914;
  box-shadow: 0 12px 32px rgba(0,0,0,0.15);
}

.media-card.expanded .media-card-snippet-text {
  -webkit-line-clamp: unset;
  overflow: visible;
  display: block;
}

.media-card.expanded .media-card-read-more {
  border-color: #6B5410;
  color: #6B5410;
}

.media-card.expanded .media-card-read-more::after {
  content: ' ↑';
}

/* TITLE SECTION */
.media-card-title-bar {
  background: #FAF7F2;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
}

.media-card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 500;
  color: #1a1410;
  line-height: 1.4;
  margin: 0;
  letter-spacing: 0.01em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* IMAGE SECTION - INSET WITH MARGIN */
.media-card-image-wrapper {
  padding: 0;
  margin: 0;
  position: relative;
}

.media-card-carousel {
  position: relative;
  width: 100%;
  max-height: 40vh;
  overflow: hidden;
  border-radius: 12px;
}

.media-card-image {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #f0f0f0, #e8e6e1);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 12px;
  flex-shrink: 0;
  position: relative;
}

.media-card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  transition: opacity 0.3s ease;
  cursor: pointer;
}

.media-card-image img.fit-image {
  object-fit: contain;
  cursor: zoom-in;
}

.media-card-image.placeholder {
  background: linear-gradient(135deg, #f5f5f5, #ececec);
  font-size: 2rem;
  color: rgba(0,0,0,0.15);
}

/* CAROUSEL CONTROLS */
.carousel-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.4);
  color: white;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  transition: all 0.3s ease;
  z-index: 10;
}

.carousel-nav:hover {
  background: rgba(0,0,0,0.7);
}

.carousel-nav.prev {
  left: 12px;
}

.carousel-nav.next {
  right: 12px;
}

.carousel-dots {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 10;
}

.carousel-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
}

.carousel-dot.active {
  background: rgba(255,255,255,0.9);
  width: 24px;
  border-radius: 4px;
}

/* METADATA ROW - DATE + TAGS */
.media-card-metadata {
  display: flex;
  gap: 1rem;
  padding: 0 0 0 0;
  margin: 0 0 16px 0;
  align-items: center;
  justify-content: space-between;
}

.media-card-date-pill {
  display: inline-flex;
  align-items: center;
  padding: 0 0 0 25px;
  margin: 10px;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
color: #eec028d4;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.media-card-event-pill {
  display: inline-flex;
  align-items: center;
  padding: 0 25px 0 0;
  margin: 10px;
  background: transparent;
  border: none;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: #eec028d4;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.media-card-tags-pill {
  display: inline-flex;
  align-items: center;
  padding: 0;
  margin: 0;
  background: transparent;
  border: none;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: #1a1410;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}

.media-card-event-pill {  
  color: #eec028d4;
}

.media-card-tags-pill {
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
}

/* DIVIDER */
.media-card-divider {
  height: 1px;
  background: #e5e0d8;
  margin: 0 24px;
}

/* SNIPPET SECTION */
.media-card-snippet {
  padding: 16px 24px 8px 24px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}

.media-card-snippet-text {
  font-size: 14px;
  font-weight: 300;
  line-height: 1.6;
  color: #555;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 0;
}

/* READ MORE BUTTON */
.media-card-button-wrapper {
  padding: 0;
  margin: 0;
}

.media-card-read-more {
  display: none;
  align-items: center;
  gap: 0.5rem;
  padding: 8px 16px;
  background: transparent;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  color: #8B6914;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.3s ease;
}

.media-card-read-more:hover {
  background: rgba(139, 105, 20, 0.08);
  border-color: #6B5410;
  color: #6B5410;
}

.media-card-read-more::after {
  content: '';
}

/* RESPONSIVE - TABLET (640px – 1024px) */
@media (min-width: 640px) and (max-width: 1024px) {
  .media-card-title {
    font-size: 18px;
  }

  .media-card-carousel,
  .media-card-image {
    height: 280px;
  }

  .media-card-image-wrapper {
    padding: 0 14px 16px 14px;
  }

  .media-card-title-bar,
  .media-card-metadata,
  .media-card-snippet,
  .media-card-button-wrapper {
    padding-left: 20px;
    padding-right: 20px;
  }

  .media-card-metadata {
    padding-bottom: 16px;
  }

  .media-card-divider {
    margin: 0 20px;
  }
}

/* RESPONSIVE - MOBILE (< 640px) */
@media (max-width: 640px) {
  .media-card-title {
    font-size: 17px;
  }

  .media-card-carousel,
  .media-card-image {
    height: 240px;
  }

  .media-card-title-bar,
  .media-card-metadata,
  .media-card-snippet,
  .media-card-button-wrapper {
    padding-left: 16px;
    padding-right: 16px;
  }

  .media-card-image-wrapper {
    padding: 0 12px 16px 12px;
  }

  .media-card-metadata {
    padding-bottom: 16px;
  }

  .media-card-divider {
    margin: 0 16px;
  }

  .media-card-snippet {
    padding-top: 12px;
    padding-bottom: 6px;
  }
}

/* Accordion Section Styling from founder_bio.html */
.accordion-container {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 2rem; padding: 0 20px;
  max-width: 1400px; margin: 0 auto;
}

.accordion-card {
  background: var(--white);
  border: 1px solid var(--cream-dark);
  border-radius: 2px;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
  position: relative;
  min-height: 280px;
}

.accordion-card:hover {
  border-color: rgba(201,168,76,0.4);
  box-shadow: 0 12px 40px rgba(0,0,0,0.08);
}

.accordion-header {
  padding: 2.5rem 2rem;
  display: flex; flex-direction: column; gap: 1.5rem;
  border-bottom: 1px solid var(--cream-dark);
  background: linear-gradient(135deg, #fafaf8 0%, #fcfbf9 100%);
}

.accordion-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem; font-weight: 400; color: var(--text-dark);
  line-height: 1.2; margin: 0;
}

.accordion-btn {
  display: flex; align-items: center; justify-content: center; gap: 0.6rem;
  padding: 0.65rem 1.4rem;
  background: transparent;
  border: 1.5px solid rgba(201,168,76,0.35);
  border-radius: 2px;
  color: var(--gold-dark);
  font-size: 0.7rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer;
  transition: all 0.35s ease;
  align-self: flex-start;
}

.accordion-btn:hover {
  border-color: rgba(201,168,76,0.65);
  background: rgba(201,168,76,0.08);
}

.accordion-btn i { font-size: 0.6rem; transition: transform 0.35s ease; }

.accordion-btn.active i { transform: rotate(180deg); }

.accordion-content {
  max-height: 0; overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.23, 1, 0.320, 1);
  padding: 0 2rem;
}

.accordion-content.active { max-height: 500px; padding: 2rem; }

.accordion-list {
  list-style: none; display: flex; flex-direction: column; gap: 1rem;
  margin: 0; padding: 0;
}

.accordion-list li {
  font-size: 0.9rem; font-weight: 300; color: var(--text-mid);
  line-height: 1.6; padding-left: 1.5rem; position: relative;
}

.accordion-list li::before {
  content: '';
  position: absolute; left: 0; width: 6px; height: 6px;
  background: var(--gold); border-radius: 50%; top: 0.6rem;
}

.accordion-card.expanded { grid-column: 1 / -1; margin-top: 1rem; }
.accordion-card.expanded .accordion-content { max-height: 600px; }

@media (max-width: 900px) {
  .accordion-container { grid-template-columns: 1fr; gap: 1.5rem; }
  .accordion-card.expanded { grid-column: 1; }
}

@media (max-width: 900px) {
  .org-card { grid-template-columns: 1fr; }
  .org-card-visual { min-height: 220px; }
  .org-card.flip .org-card-visual { order: 1; }
  .org-card.flip .org-card-body { order: 2; }
  .impact-4 { grid-template-columns: 1fr 1fr; }
  .recognition-strip { flex-direction: column; gap: 2rem; padding: 2.5rem 2rem; }
}

@media (max-width: 640px) {
  .news-grid-3 { grid-template-columns: 1fr; }
  .news-card { padding: 2.5rem 2rem; }
  .news-title { font-size: 1.3rem; }
  .filter-bar { gap: 1.5rem; margin-bottom: 3rem; }
}

</style>

</head>

<script>
  // ── NEWSROOM DYNAMIC CARD RENDERING ──────────────────────
  let _newsroomReady = false;
  function initializeNewsroom() {
    if (_newsroomReady) return;
    _newsroomReady = true;
    const gridContainer = document.getElementById('news-grid-container');
    const emptyStateBanner = document.getElementById('empty-state-banner');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // Get all articles from TATER.news (populated by data-loader.js)
    const articles = TATER.news.articles || [];

    // Function to render cards based on active filter
    function renderCards(category) {
      gridContainer.innerHTML = ''; // Clear existing cards

      // Filter articles by category
      const filteredArticles = articles.filter(article => article.category === category);

      // Show/hide empty state
      if (filteredArticles.length === 0) {
        emptyStateBanner.style.display = 'block';
        gridContainer.style.display = 'none';
        return;
      }

      emptyStateBanner.style.display = 'none';
      gridContainer.style.display = 'grid';

      // Apply media grid layout for media category
      if (category === 'media') {
        gridContainer.classList.add('media-grid');
      } else {
        gridContainer.classList.remove('media-grid');
      }

      // Render each article as a card
      filteredArticles.forEach(article => {
        // Use media-card layout for media category, standard news-card for others
        if (category === 'media') {
          const mediaCard = document.createElement('div');
          mediaCard.className = 'media-card';
          mediaCard.setAttribute('data-category', 'media');

          // Handle multiple images or single image
          // article.image can be a string, array, or undefined
          let images = article.images ? article.images : (article.image ? (Array.isArray(article.image) ? article.image : [article.image]) : []);
          const hasMultipleImages = images.length > 1;

          let imageHTML = '';
          if (images.length > 0) {
            if (hasMultipleImages) {
              imageHTML = `
                <div class="media-card-carousel">
                  ${images.map((img, idx) => `
                    <div class="media-card-image" data-index="${idx}" style="display: ${idx === 0 ? 'flex' : 'none'};">
                      <img src="${img}" alt="${article.title} - Image ${idx + 1}" loading="lazy" decoding="async">
                    </div>
                  `).join('')}
                  <button class="carousel-nav prev">‹</button>
                  <button class="carousel-nav next">›</button>
                  <div class="carousel-dots">
                    ${images.map((_, idx) => `
                      <button class="carousel-dot ${idx === 0 ? 'active' : ''}" data-index="${idx}"></button>
                    `).join('')}
                  </div>
                </div>
              `;
            } else {
              imageHTML = `
                <div class="media-card-image">
                  <img src="${images[0]}" alt="${article.title}" loading="lazy" decoding="async">
                </div>
              `;
            }
          } else {
            imageHTML = `<div class="media-card-image placeholder">•</div>`;
          }

          const tagsHTML = article.tags ? article.tags : article.category.charAt(0).toUpperCase() + article.category.slice(1);

          mediaCard.innerHTML = `
            <div class="media-card-metadata">
              <div class="media-card-date-pill">${article.date}</div>
              <div class="media-card-event-pill" data-event-id="${article.eventId}" style="cursor: pointer;">${article.eventName || 'Event'}</div>
            </div>
            <div class="media-card-image-wrapper">
              ${imageHTML}
            </div>
            <div class="media-card-button-wrapper">
              <a href="#newsroom-section" class="media-card-read-more" data-event-id="${article.eventId}">
                View Event →
              </a>
            </div>
          `;

          gridContainer.appendChild(mediaCard);

          // Setup carousel functionality if multiple images
          if (hasMultipleImages) {
            let currentImageIndex = 0;
            const imageElements = mediaCard.querySelectorAll('.media-card-image[data-index]');
            const dots = mediaCard.querySelectorAll('.carousel-dot');

            function showImage(index) {
              // Hide all images
              imageElements.forEach(el => el.style.display = 'none');
              // Show current image
              imageElements[index].style.display = 'flex';
              // Update dots
              dots.forEach(dot => dot.classList.remove('active'));
              dots[index].classList.add('active');
              currentImageIndex = index;
            }

            // Previous button
            mediaCard.querySelector('.carousel-nav.prev').addEventListener('click', (e) => {
              e.stopPropagation();
              currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
              showImage(currentImageIndex);
            });

            // Next button
            mediaCard.querySelector('.carousel-nav.next').addEventListener('click', (e) => {
              e.stopPropagation();
              currentImageIndex = (currentImageIndex + 1) % images.length;
              showImage(currentImageIndex);
            });

            // Dot buttons
            dots.forEach((dot, idx) => {
              dot.addEventListener('click', (e) => {
                e.stopPropagation();
                showImage(idx);
              });
            });

            // Auto-rotate carousel every 5 seconds
            let autoRotateInterval = setInterval(() => {
              currentImageIndex = (currentImageIndex + 1) % images.length;
              showImage(currentImageIndex);
            }, 5000);

            // Clear interval on mouse enter, resume on mouse leave
            mediaCard.querySelector('.media-card-carousel').addEventListener('mouseenter', () => {
              clearInterval(autoRotateInterval);
            });

            mediaCard.querySelector('.media-card-carousel').addEventListener('mouseleave', () => {
              autoRotateInterval = setInterval(() => {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                showImage(currentImageIndex);
              }, 5000);
            });
          }

          // Setup View Event functionality on event pill
          const eventPill = mediaCard.querySelector('.media-card-event-pill');
          const eventId = eventPill.getAttribute('data-event-id');

          eventPill.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // Click the Events filter button
            const eventsFilterBtn = document.querySelector('.filter-btn[data-filter="events"]');
            if (eventsFilterBtn) {
              eventsFilterBtn.click();

              // Scroll to the event card with slight delay to allow rendering
              setTimeout(() => {
                const eventCard = document.querySelector(`[data-article-id="${eventId}"]`);
                if (eventCard) {
                  eventCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  eventCard.classList.add('highlight');
                  setTimeout(() => {
                    eventCard.classList.remove('highlight');
                  }, 3000);
                }
              }, 100);
            }
          });

          // Add click listener to toggle image fit (for single images or carousel)
          if (!hasMultipleImages) {
            const imageWrapper = mediaCard.querySelector('.media-card-image');
            if (imageWrapper) {
              const img = imageWrapper.querySelector('img');
              if (img) {
                imageWrapper.addEventListener('click', function(e) {
                  e.stopPropagation();
                  img.classList.toggle('fit-image');
                });
              }
            }
          }
        } else {
          // Standard news card layout
          const card = document.createElement('div');
          card.className = 'news-card';
          card.setAttribute('data-category', article.category);
          card.setAttribute('data-article-id', article.id);

          // For events, use larger card with carousel support
          if (article.category === 'events') {
            card.classList.add('event-card');

            // Handle multiple images or single image for events
            // article.image can be a string, array, or undefined
            let images = article.images ? article.images : (article.image ? (Array.isArray(article.image) ? article.image : [article.image]) : []);
            const hasMultipleImages = images.length > 1;

            let imageHTML = '';
            if (images.length > 0) {
              if (hasMultipleImages) {
                imageHTML = `
                  <div class="event-card-carousel">
                    ${images.map((img, idx) => `
                      <div class="event-card-image" data-index="${idx}" style="display: ${idx === 0 ? 'flex' : 'none'};">
                      <img src="${img}" alt="${article.title} - Image ${idx + 1}" loading="lazy" decoding="async">
                      </div>
                    `).join('')}
                    <button class="carousel-nav prev">‹</button>
                    <button class="carousel-nav next">›</button>
                    <div class="carousel-dots">
                      ${images.map((_, idx) => `
                        <button class="carousel-dot ${idx === 0 ? 'active' : ''}" data-index="${idx}"></button>
                      `).join('')}
                    </div>
                  </div>
                `;
              } else {
                imageHTML = `
                  <div class="event-card-image">
                  <img src="${images[0]}" alt="${article.title}" loading="lazy" decoding="async">
                  </div>
                `;
              }
            } else {
              imageHTML = `<div class="event-card-image placeholder">•</div>`;
            }

            // Handle summary as string or array of paragraphs
            const summaryHTML = Array.isArray(article.summary)
              ? article.summary.map(p => `<p class="news-body event-card-summary">${p}</p>`).join('')
              : `<p class="news-body event-card-summary">${article.summary}</p>`;

            card.innerHTML = `
              <div class="event-card-image-wrapper">
                ${imageHTML}
              </div>
              <div class="event-card-meta-row">
                <div class="news-tag">${article.category.charAt(0).toUpperCase() + article.category.slice(1)}</div>
                <div class="event-card-date">${article.date}</div>
              </div>
              <h3 class="news-title">${article.title}</h3>
              <div class="event-card-body">${summaryHTML}</div>
            `;

            // Setup carousel for events if multiple images
            if (hasMultipleImages) {
              let currentImageIndex = 0;
              const imageElements = card.querySelectorAll('.event-card-image[data-index]');
              const dots = card.querySelectorAll('.carousel-dot');

              function showImage(index) {
                imageElements.forEach(el => el.style.display = 'none');
                imageElements[index].style.display = 'flex';
                dots.forEach(dot => dot.classList.remove('active'));
                dots[index].classList.add('active');
                currentImageIndex = index;
              }

              card.querySelector('.carousel-nav.prev').addEventListener('click', (e) => {
                e.stopPropagation();
                currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                showImage(currentImageIndex);
              });

              card.querySelector('.carousel-nav.next').addEventListener('click', (e) => {
                e.stopPropagation();
                currentImageIndex = (currentImageIndex + 1) % images.length;
                showImage(currentImageIndex);
              });

              dots.forEach((dot, idx) => {
                dot.addEventListener('click', (e) => {
                  e.stopPropagation();
                  showImage(idx);
                });
              });

              // Auto-rotate
              let autoRotateInterval = setInterval(() => {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                showImage(currentImageIndex);
              }, 5000);

              card.querySelector('.event-card-carousel').addEventListener('mouseenter', () => {
                clearInterval(autoRotateInterval);
              });

              card.querySelector('.event-card-carousel').addEventListener('mouseleave', () => {
                autoRotateInterval = setInterval(() => {
                  currentImageIndex = (currentImageIndex + 1) % images.length;
                  showImage(currentImageIndex);
                }, 5000);
              });
            }

            // Setup expandable text for events
            const bodyText = card.querySelector('.event-card-body');
            setTimeout(() => {
              const lineHeight = parseFloat(window.getComputedStyle(card.querySelector('.news-body')).lineHeight);
              const maxHeight = lineHeight * 3;
              const fullHeight = bodyText.scrollHeight;

              if (fullHeight > maxHeight) {
                bodyText.style.maxHeight = maxHeight + 'px';
                bodyText.classList.add('truncated');

                // Add Read More link
                const readMoreLink = document.createElement('a');
                readMoreLink.href = '#';
                readMoreLink.className = 'event-card-read-more';
                readMoreLink.textContent = 'Read More ↓';
                readMoreLink.style.cssText = 'display: inline-block; margin-top: 0.5rem; font-size: 0.7rem; color: var(--gold); text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; cursor: pointer;';

                readMoreLink.addEventListener('click', (e) => {
                  e.preventDefault();
                  e.stopPropagation();

                  if (bodyText.classList.contains('expanded')) {
                    bodyText.style.maxHeight = maxHeight + 'px';
                    bodyText.classList.remove('expanded');
                    readMoreLink.textContent = 'Read More ↓';
                    card.classList.remove('expanded');
                  } else {
                    bodyText.style.maxHeight = 'none';
                    bodyText.classList.add('expanded');
                    readMoreLink.textContent = 'Read Less ↑';
                    card.classList.add('expanded');
                  }
                });

                bodyText.parentNode.insertBefore(readMoreLink, bodyText.nextSibling);
              }
            }, 0);

          } else {
            // Non-event cards (participation, achievements) with carousel support
            // article.image can be a string, array, or undefined
            let images = article.images ? article.images : (article.image ? (Array.isArray(article.image) ? article.image : [article.image]) : []);
            const hasMultipleImages = images.length > 1;

            let imageHTML = '';
            if (images.length > 0) {
              if (hasMultipleImages) {
                imageHTML = `
                  <div class="event-card-carousel" style="width: calc(100% + 6rem); margin: -3rem -3rem 1rem -3rem; position: relative;">
                    ${images.map((img, idx) => `
                      <div class="event-card-image" data-index="${idx}" style="display: ${idx === 0 ? 'flex' : 'none'}; width: calc(100% - 0px); height: 200px;">
                      <img src="${img}" alt="${article.title} - Image ${idx + 1}" style="width: 100%; height: 100%; object-fit: contain;" loading="lazy" decoding="async">
                      </div>
                    `).join('')}
                    <button class="carousel-nav prev">‹</button>
                    <button class="carousel-nav next">›</button>
                    <div class="carousel-dots">
                      ${images.map((_, idx) => `
                        <button class="carousel-dot ${idx === 0 ? 'active' : ''}" data-index="${idx}"></button>
                      `).join('')}
                    </div>
                  </div>
                `;
              } else {
                imageHTML = `
                  <div style="width: calc(100% + 6rem); height: 200px; background: linear-gradient(135deg, #0f1a2e, #162035); overflow: hidden; margin: -3rem -3rem 1rem -3rem; display: flex; align-items: center; justify-content: center;">
                    <img src="${images[0]}" alt="${article.title}" style="width: 100%; height: 100%; object-fit: contain;" loading="lazy" decoding="async">
                  </div>
                `;
              }
            } else {
              imageHTML = `<div style="width: calc(100% + 6rem); height: 200px; background: linear-gradient(135deg, #0f1a2e, #162035); margin: -3rem -3rem 1rem -3rem;"></div>`;
            }

            // Handle summary as string or array of paragraphs
            const summaryHTMLNonEvent = Array.isArray(article.summary)
              ? article.summary.map(p => `<p class="news-body" style="margin: 0 0 1rem 0; font-size: 0.82rem; font-weight: 300; line-height: 1.85; color: rgba(255,255,255,0.35);">${p}</p>`).join('')
              : `<p class="news-body">${article.summary}</p>`;

            card.innerHTML = `
              ${imageHTML}
              <div class="news-tag">${article.category.charAt(0).toUpperCase() + article.category.slice(1)}</div>
              <h3 class="news-title">${article.title}</h3>
              <div>${summaryHTMLNonEvent}</div>
              <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid rgba(201,168,76,0.15);">
                <span style="font-size: 0.75rem; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase;">${article.date}</span>
              </div>
            `;

            // Setup carousel for non-event cards if multiple images
            if (hasMultipleImages) {
              let currentImageIndex = 0;
              const imageElements = card.querySelectorAll('.event-card-image[data-index]');
              const dots = card.querySelectorAll('.carousel-dot');

              function showImage(index) {
                imageElements.forEach(el => el.style.display = 'none');
                imageElements[index].style.display = 'flex';
                dots.forEach(dot => dot.classList.remove('active'));
                dots[index].classList.add('active');
                currentImageIndex = index;
              }

              card.querySelector('.carousel-nav.prev').addEventListener('click', (e) => {
                e.stopPropagation();
                currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                showImage(currentImageIndex);
              });

              card.querySelector('.carousel-nav.next').addEventListener('click', (e) => {
                e.stopPropagation();
                currentImageIndex = (currentImageIndex + 1) % images.length;
                showImage(currentImageIndex);
              });

              dots.forEach((dot, idx) => {
                dot.addEventListener('click', (e) => {
                  e.stopPropagation();
                  showImage(idx);
                });
              });

              // Auto-rotate
              let autoRotateInterval = setInterval(() => {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                showImage(currentImageIndex);
              }, 5000);

              card.querySelector('.event-card-carousel').addEventListener('mouseenter', () => {
                clearInterval(autoRotateInterval);
              });

              card.querySelector('.event-card-carousel').addEventListener('mouseleave', () => {
                autoRotateInterval = setInterval(() => {
                  currentImageIndex = (currentImageIndex + 1) % images.length;
                  showImage(currentImageIndex);
                }, 5000);
              });
            }
          }

          gridContainer.appendChild(card);
        }
      });
    }

    // Filter button click handlers
    filterButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        // Remove active class from all buttons
        filterButtons.forEach(b => b.classList.remove('active'));
        // Add active class to clicked button
        this.classList.add('active');
        // Get the filter category from button
        const category = this.getAttribute('data-filter');
        // Render cards for this category
        renderCards(category);
      });
    });

    // Function to handle hash-based category filtering
    function applyHashFilter() {
      const hash = window.location.hash.substring(1); // Remove # prefix
      const validCategories = ['participation', 'events', 'achievements', 'media'];
      if (hash && validCategories.includes(hash)) {
        const filterBtn = document.querySelector(`.filter-btn[data-filter="${hash}"]`);
        if (filterBtn) {
          filterBtn.click();
        }
      }
    }

    // Check hash on initial load
    const hash = window.location.hash.substring(1);
    const validCategories = ['participation', 'events', 'achievements', 'media'];
    if (hash && validCategories.includes(hash)) {
      applyHashFilter();
    } else {
      // Initial render with 'events' category selected
      renderCards('events');
    }

    // Listen for hash changes (when dropdown link is clicked)
    window.addEventListener('hashchange', applyHashFilter);
  }

  // Call initializeNewsroom when articles are available
  // Check every 100ms for up to 5 seconds
  let checkCount = 0;
  const checkInterval = setInterval(() => {
    checkCount++;
    if (TATER && TATER.news && TATER.news.articles && TATER.news.articles.length > 0) {
      clearInterval(checkInterval);
      initializeNewsroom();
    } else if (checkCount > 50) {
      // Timeout after 5 seconds, initialize anyway
      clearInterval(checkInterval);
      initializeNewsroom();
    }
  }, 100);

  // Also call on DOMContentLoaded as backup
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeNewsroom);
  } else {
    setTimeout(initializeNewsroom, 100);
  }
</script>
</body>
</html>
